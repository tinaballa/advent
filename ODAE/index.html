<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdeff2">
  <title>Advent Calendar 2026</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/script.js"></script>
</head>
<body>
  <main class="poster">
    <img class="ornament ornament-01" src="/Icon_01.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-02" src="/Icon_02.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-03" src="/Icon_03.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-04" src="/Icon_04.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-05" src="/Icon_05.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-06" src="/Icon_06.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-07" src="/Icon_07.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-08" src="/Icon_08.svg" alt="" aria-hidden="true">
    <img class="ornament ornament-09" src="/Icon_09.svg" alt="" aria-hidden="true">
    <header class="heading"><h1 id="title">Advent Calendar 2026</h1><p class="subtitle" id="subtitle">A new favourite recipe every day</p></header>
    <section class="calendar" aria-label="Advent calendar"><div class="doors" id="doors"></div></section>
    <p class="notice" id="notice" aria-live="polite"></p>
    <footer><span id="groupLabel"></span><span>2026</span></footer>
  </main>
  <dialog id="recipeDialog" aria-labelledby="dialogTitle"><div class="dialog-inner"><button class="close" id="closeDialog" aria-label="Close">×</button><p class="eyebrow" id="dialogEyebrow">Day</p><h2 id="dialogTitle"></h2><p id="dialogText"></p><a class="pdf-link" id="pdfLink" href="#" target="_blank" rel="noopener" hidden>Open PDF</a></div></dialog>
</body>
</html>
